# ---- Build JVM ----
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- AndroidX (required by MapLibre) ----
android.useAndroidX=true
# Do NOT enable jetifier: we have no legacy support-library deps.
android.enableJetifier=false

# ---- Size / RAM optimisations ----
# Non-transitive R: each module only sees its own R class -> smaller DEX, faster class loading.
android.nonTransitiveRClass=true
# R8 full mode: more aggressive inlining / class merging. Requires the ProGuard rules in app/proguard-rules.pro.
android.enableR8.fullMode=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
